; ============================================================
; 无人机 LoRa Mesh 数传 —— 多方案 PlatformIO 工程
; 一个 [env:方案名] = 一块板 + 一个射频模块，各出独立固件
; 方案命名：<板>-<射频>
; 编译：pio run -e <方案名>，或 scripts/build_all.sh 批量编译全部（Linux）
; 加新方案见 docs/HARDWARE_VARIANTS.md
; ============================================================

; ---- 公共段（所有方案继承）----
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    ; 全部本地化到 lib/：mavlink2（MAVLink 协议）+ radiolib（RadioLib 6.6.0）+ neopixel（NeoPixel 1.15.5）
    ; 完全离线编译，不依赖 registry 下载

; ---- 方案 1：ESP32-S3 SuperMini + E220-900M22S ----
[env:esp32s3-supermini-e220-900m22s]
board = esp32-s3-devkitc-1
; flash 访问模式必须 QIO（不能靠 board 默认的 DIO）：
; SuperMini 有「封装内 flash + 内嵌 PSRAM」的批次（如 ESP32-S3FH4R2 类），
; DIO 下 bootloader 读不到 app，表现为「esptool 能识别芯片、串口零输出、固件永不启动」；
; 外挂 XMC flash 的批次在 DIO 下也能跑，所以统一 QIO 覆盖所有批次。
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DBOARD_ESP32S3_SUPERMINI
    -DRADIO_E220_900M22S
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

