; ============================================================
; 无人机 LoRa Mesh 数传 —— 多方案 PlatformIO 工程
; 一个 [env:方案名] = 一块板 + 一个射频模块，各出独立固件
; 方案命名：<板>-<射频>
; 编译：pio run -e <方案名>，或 scripts/build_all.sh 批量编译全部（Linux）
; 加新方案见 docs/HARDWARE_VARIANTS.md
; ============================================================

; ---- 公共段（所有方案继承）----
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    ; RadioLib 已本地化到 lib/radiolib/（离线可用，版本固定 6.6.0）
    ; mavlink 已本地化到 lib/mavlink2/（GitHub 直连易断流，见 tool.md §3）

; ---- 方案 1：ESP32-S3 SuperMini + E220-900M22S ----
[env:esp32s3-supermini-e220-900m22s]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DBOARD_ESP32S3_SUPERMINI
    -DRADIO_E220_900M22S
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

